name: Build release zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          rm -f fse-balance-plugin.zip
          zip -r fse-balance-plugin.zip fse-balance-plugin

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: fse-balance-plugin.zip
